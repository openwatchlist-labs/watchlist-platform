name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-restart-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owl_ci
          POSTGRES_PASSWORD: owl_ci
          POSTGRES_DB: owl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U owl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # ADR-0001 SEC-1 §3 "Roles and DSNs": owl_app is the identity every
      # sink DSN uses (never BYPASSRLS, subject to FORCE) and is what
      # anything exercising RLS -- including this var -- must connect as.
      # owl_ci (the service's bootstrap POSTGRES_USER) is a superuser and
      # unconditionally bypasses row security regardless of FORCE, so it
      # must not be the identity CI tests connect as (INFRA-4).
      OWL_TEST_DATABASE_URL: postgresql://owl_app:owl_app@localhost:5432/owl_ci
      OWL_MIGRATOR_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci
      # SEC-7 D3: owl_ledger_anchor, the anchor-writing identity, distinct
      # from owl_migrator by construction (docs/adr/0007-audit-chain-integrity.md
      # §5.3). Provisioned by provision_test_roles.sh create-roles below;
      # granted INSERT-only on screening_ledger_anchor after
      # db/migrations/015_screening_ledger_anchor.sql creates the table
      # (Addendum 1 D17/F6: it is no longer the owner -- see
      # OWL_LEDGER_DDL_DATABASE_URL below).
      OWL_LEDGER_ANCHOR_DATABASE_URL: postgresql://owl_ledger_anchor:owl_ledger_anchor@localhost:5432/owl_ci
      # SEC-7 repair, Addendum 1 D17/F6: owl_ledger_ddl owns
      # screening_ledger_anchor so the runtime writer (owl_ledger_anchor)
      # cannot ALTER or DROP the table's own protections. Nothing connects
      # as owl_ledger_ddl at runtime -- this DSN exists only so the test
      # suite can prove the TRUNCATE/immutability triggers hold even for
      # the table's true owner (TestSEC7AnchorTableRejectsTruncate), the
      # same standard already held for the six pre-existing tables.
      OWL_LEDGER_DDL_DATABASE_URL: postgresql://owl_ledger_ddl:owl_ledger_ddl@localhost:5432/owl_ci
      # SEC-7 Addendum 2 D21/D22 (F-E, CRITICAL): a second, disposable
      # database migrated only through 016 -- never 017 -- so
      # TestMigrateFailsOnStaleAnchorTable can reproduce CAP §7.6's exact
      # finding (Migrate() reporting success on a partially migrated
      # schema) against a real Postgres, without risking the primary
      # owl_ci database other suites depend on concurrently.
      OWL_MIGRATOR_STALE_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_stale
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Provision owl_migrator, owl_app, owl_ledger_anchor, and owl_ledger_ddl roles
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
          OWL_MIGRATOR_PASSWORD: owl_migrator
          OWL_APP_PASSWORD: owl_app
          OWL_LEDGER_ANCHOR_PASSWORD: owl_ledger_anchor
          OWL_LEDGER_DDL_PASSWORD: owl_ledger_ddl
        run: ./scripts/ci/provision_test_roles.sh create-roles
      - name: Apply database migrations
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U owl_migrator -d owl_ci -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Grant owl_app privileges on tenant-scoped tables
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-app-privileges
      - name: Transfer anchor/tombstone ownership to owl_ledger_ddl and install the D26 DDL event trigger
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-ddl-ownership
      - name: Create SEC-7 Addendum 2 stale-schema database (D21/D22)
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-stale-anchor-database
      - name: Apply migrations through 016 only to the stale-schema database
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            base="$(basename "$f")"
            [[ "$base" > "016_screening_ledger_anchor_sequence_comment.sql" ]] && continue
            echo "applying $f to owl_ci_sec7_stale"
            psql -h localhost -U owl_migrator -d owl_ci_sec7_stale -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run clean-restart CI
        shell: bash
        run: ./scripts/ci/run-ci.sh
