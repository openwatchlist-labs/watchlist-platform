name: CI

on:
  pull_request:
    # A PR that touches only these paths skips this workflow entirely (not
    # merely a skipped job -- GitHub does not trigger the run). Two subtrees
    # are carved back out with '!' negations because CI itself validates
    # their content, not just repo build correctness:
    #   - docs/governance/**: scripts/ci/verify-legacy-lineage.py directly
    #     validates docs/governance/legacy-qualification-lineage.json (the
    #     clean-restart lineage control file, CLAUDE.md rule 2) and
    #     references legacy-repository.md / legacy-qualification-lineage.md
    #     there; verify-clean-restart.sh also requires
    #     docs/governance/clean-restart-r1.md to exist.
    #   - docs/homelab/** and scripts/deployment/r2-4/**:
    #     verify-homelab-r2-4-publication.sh scans this content for leaked
    #     private info (IPs, usernames, home paths) before public release,
    #     and requires specific files under both trees to exist.
    # A "documentation change" to any of these three subtrees is exactly
    # the content these gates exist to check -- it must still run.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '!docs/governance/**'
      - '!docs/homelab/**'
      - '!scripts/deployment/r2-4/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-restart-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owl_ci
          POSTGRES_PASSWORD: owl_ci
          POSTGRES_DB: owl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U owl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # ADR-0001 SEC-1 §3 "Roles and DSNs": owl_app is the identity every
      # sink DSN uses (never BYPASSRLS, subject to FORCE) and is what
      # anything exercising RLS -- including this var -- must connect as.
      # owl_ci (the service's bootstrap POSTGRES_USER) is a superuser and
      # unconditionally bypasses row security regardless of FORCE, so it
      # must not be the identity CI tests connect as (INFRA-4).
      OWL_TEST_DATABASE_URL: postgresql://owl_app:owl_app@localhost:5432/owl_ci
      OWL_MIGRATOR_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci
      # SEC-7 D3: owl_ledger_anchor, the anchor-writing identity, distinct
      # from owl_migrator by construction (docs/adr/0007-audit-chain-integrity.md
      # §5.3). Provisioned by provision_test_roles.sh create-roles below;
      # granted INSERT-only on screening_ledger_anchor after
      # db/migrations/015_screening_ledger_anchor.sql creates the table
      # (Addendum 1 D17/F6: it is no longer the owner -- see
      # OWL_LEDGER_DDL_DATABASE_URL below).
      OWL_LEDGER_ANCHOR_DATABASE_URL: postgresql://owl_ledger_anchor:owl_ledger_anchor@localhost:5432/owl_ci
      # SEC-7 repair, Addendum 1 D17/F6: owl_ledger_ddl owns
      # screening_ledger_anchor so the runtime writer (owl_ledger_anchor)
      # cannot ALTER or DROP the table's own protections. Nothing connects
      # as owl_ledger_ddl at runtime -- this DSN exists only so the test
      # suite can prove the TRUNCATE/immutability triggers hold even for
      # the table's true owner (TestSEC7AnchorTableRejectsTruncate), the
      # same standard already held for the six pre-existing tables.
      OWL_LEDGER_DDL_DATABASE_URL: postgresql://owl_ledger_ddl:owl_ledger_ddl@localhost:5432/owl_ci
      # SEC-7 Addendum 2 D21/D22 (F-E, CRITICAL): a second, disposable
      # database migrated only through 016 -- never 017 -- so
      # TestMigrateFailsOnStaleAnchorTable can reproduce CAP §7.6's exact
      # finding (Migrate() reporting success on a partially migrated
      # schema) against a real Postgres, without risking the primary
      # owl_ci database other suites depend on concurrently.
      OWL_MIGRATOR_STALE_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_stale
      # SEC-7 Addendum 3 D34/D37 (G-G, LOW): reproducing ALTER TABLE ...
      # RENAME TO / SET SCHEMA against a genuinely privileged role is the
      # only way to prove D34's event trigger -- not a schema-privilege
      # accident -- is what blocks it, since neither owl_migrator (does
      # not own the protected relations) nor owl_ledger_ddl (owns them,
      # but is deliberately granted no CREATE on schema public) can reach
      # the trigger with this specific DDL form. owl_ci is the bootstrap
      # superuser INFRA-3 already provisions; this DSN grants the test
      # suite nothing it does not already have via provision_test_roles.sh
      # itself, which already connects as this same identity.
      OWL_BOOTSTRAP_SUPERUSER_DATABASE_URL: postgresql://owl_ci:owl_ci@localhost:5432/owl_ci
      # SEC-7 Addendum 3 D33/D37 (G-A, HIGH): a third disposable database,
      # every migration applied in full but grant-ddl-ownership never run
      # -- CAP #2 §7.5's exact owl_p4 state, distinct from the stale-schema
      # database above (that one is missing a MIGRATION; this one is
      # missing PROVISIONING, with none absent).
      OWL_MIGRATOR_UNPROVISIONED_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_unprovisioned
      # SEC-2 followup (Sprint 0 register reconciliation): a fourth
      # disposable database with ZERO db/migrations/ applied -- unlike the
      # stale (some migrations) and unprovisioned (every migration) ones
      # above, this one gets none at all. internal/schemasqlgate's suite
      # provisions it itself, by executing screeningledger/alertcase/
      # assistancerag's own SchemaSQL consts directly over a live
      # connection (Migrate()'s real bootstrap path, with no dependency on
      # db/migrations/ ever having run), then proves TRUNCATE guards hold
      # -- the check that would have caught alertcase/assistancerag's
      # SchemaSQL independently drifting out of sync with
      # db/migrations/012_truncate_guards.sql, which is exactly what
      # happened.
      OWL_SCHEMASQL_ONLY_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_schemasql_only
      # ADR-0007 Addendum 5 D43/D49 test 1 (I-A, MEDIUM): the two pg_dump
      # variants CAP #4 §7.6 demonstrated, made permanent CI fixtures the
      # same way owl_ci_sec7_stale/owl_ci_sec7_unprovisioned already are.
      # A fifth and sixth disposable database -- unlike those two, both
      # are built by provision_test_roles.sh's own
      # create-restored-database step, not by a separate "apply
      # migrations" step here: the fixture IS the copy operation.
      OWL_MIGRATOR_RESTORED_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_restored
      OWL_MIGRATOR_CLONED_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_cloned
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Provision owl_migrator, owl_app, owl_ledger_anchor, and owl_ledger_ddl roles
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
          OWL_MIGRATOR_PASSWORD: owl_migrator
          OWL_APP_PASSWORD: owl_app
          OWL_LEDGER_ANCHOR_PASSWORD: owl_ledger_anchor
          OWL_LEDGER_DDL_PASSWORD: owl_ledger_ddl
        run: ./scripts/ci/provision_test_roles.sh create-roles
      - name: Apply database migrations
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U owl_migrator -d owl_ci -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Grant owl_app privileges on tenant-scoped tables
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-app-privileges
      - name: Transfer anchor/tombstone ownership to owl_ledger_ddl and install the D26 DDL event trigger
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-ddl-ownership
      - name: Create SEC-7 Addendum 2 stale-schema database (D21/D22)
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-stale-anchor-database
      - name: Apply migrations through 016 only to the stale-schema database
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            base="$(basename "$f")"
            [[ "$base" > "016_screening_ledger_anchor_sequence_comment.sql" ]] && continue
            echo "applying $f to owl_ci_sec7_stale"
            psql -h localhost -U owl_migrator -d owl_ci_sec7_stale -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Create SEC-7 Addendum 3 unprovisioned-schema database (D33/G-A)
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-unprovisioned-database
      - name: Apply every migration, but no provisioning, to the unprovisioned database
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f to owl_ci_sec7_unprovisioned"
            psql -h localhost -U owl_migrator -d owl_ci_sec7_unprovisioned -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Create SEC-2 followup SchemaSQL-only-bootstrap database
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-schemasql-only-database
      - name: Install PostgreSQL 17 client and server tools (pg_dump/pg_restore version match)
        # create-restored-database is the first SEC-7 fixture in this whole
        # arc to invoke pg_dump/pg_restore -- every prior fixture (stale
        # anchor, unprovisioned, schemasql-only) is built with psql alone,
        # which has no server-version compatibility check. pg_dump refuses
        # to run against a server newer than itself ("aborting because of
        # server version mismatch"), and the runner's default
        # postgresql-client does not reliably match the postgres:17 service
        # container above, so this pins an explicit matching client
        # version rather than depending on whatever the runner image
        # happens to ship by default.
        #
        # ADR-0007 Addendum 7 D66: postgresql-17 (the SERVER package, not
        # only postgresql-client-17) is installed alongside the client for
        # scripts/ci/verify_cross_cluster_dr.sh below, which needs
        # initdb/pg_ctl/postgres to stand up a genuinely SECOND,
        # disposable cluster distinct from the postgres:17 service
        # container -- D66's own finding requires proving the cross-cluster
        # DR procedure against real, separate clusters, not one database
        # on the same server.
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # ADR-0007 Addendum 6 D57: pin the fetched key to its known
          # fingerprint before the repository that trusts it is added.
          # --fail above guards only against a 404 body being written as
          # a key; this guards against a substituted key served with a
          # 200 response. Captured by `gpg --show-keys` against the
          # fetched key at implementation time; its last eight hex
          # digits match the key URL's own filename (ACCC4CF8).
          actual_fingerprint="$(gpg --show-keys --with-fingerprint --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | awk -F: '$1=="fpr"{print $10; exit}')"
          if [[ "$actual_fingerprint" != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]]; then
            echo "PGDG signing key fingerprint mismatch: got $actual_fingerprint, expected B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8 -- refusing to trust it" >&2
            exit 1
          fi
          # ADR-0007 Addendum 6 D57: scope the PGDG origin to the packages
          # this step wants, via an APT preferences pin -- closes CAP #5
          # §7.7 property 2 ("apt-get update makes PGDG a candidate source
          # for every package on the runner, not only postgresql-client-17").
          # ADR-0007 Addendum 7 D66 adds postgresql-17 as its own closed-set
          # stanza rather than widening the existing pattern to match it,
          # per D31's "closed set of objects, not a name pattern" -- the
          # set this pin trusts PGDG for is named explicitly, not guessed.
          # Both packages stay unpinned by minor version (CAP #5 §7.7
          # property 3), which is what keeps the client matched to the
          # floating postgres:17 service container this step exists to
          # match.
          printf 'Package: *\nPin: origin apt.postgresql.org\nPin-Priority: -1\n\nPackage: postgresql-client-*\nPin: origin apt.postgresql.org\nPin-Priority: 500\n\nPackage: postgresql-17\nPin: origin apt.postgresql.org\nPin-Priority: 500\n' | sudo tee /etc/apt/preferences.d/pgdg.pref >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # postgresql-17's postinst auto-creates AND starts a default
          # cluster on port 5432 by default, which is already bound by the
          # postgres:17 service container above -- policy-rc.d blocks every
          # service (re)start package installation would otherwise trigger,
          # the standard Debian/Docker convention for "install packages,
          # do not let them start services." This repository's own cluster
          # (scripts/ci/verify_cross_cluster_dr.sh) is started explicitly,
          # afterward, on its own port, from its own scratch data directory
          # -- the auto-created default cluster is never used.
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get install -y postgresql-client-17 postgresql-17
          sudo rm -f /usr/sbin/policy-rc.d
          pg_dump --version
          /usr/lib/postgresql/17/bin/initdb --version
      - name: Create SEC-7 Addendum 5 restored/cloned copy-state fixtures (D43/D49 test 1)
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-restored-database
      - name: Verify SEC-7 cross-cluster DR procedure (ADR-0007 Addendum 7 D66)
        shell: bash
        env:
          PG_BIN_DIR: /usr/lib/postgresql/17/bin
          PRIMARY_PGHOST: localhost
          PRIMARY_PGPORT: "5432"
          PRIMARY_PGSUPERUSER: owl_ci
          PRIMARY_PGSUPERPASSWORD: owl_ci
          PRIMARY_PGDATABASE: owl_ci
        run: ./scripts/ci/verify_cross_cluster_dr.sh
      - name: SEC-7 DR-tooling temp hygiene and concurrency (ADR-0007 Addendum 9 D83/D85 test 7)
        # Same env as the step above, so cases 3-4 (temp-count hygiene,
        # two concurrent invocations) actually run here rather than
        # self-skipping -- scripts/ci/run-ci.sh's own later invocation of
        # this test does not carry these variables forward and only
        # exercises its static checks (1-2).
        shell: bash
        env:
          PG_BIN_DIR: /usr/lib/postgresql/17/bin
          PRIMARY_PGHOST: localhost
          PRIMARY_PGPORT: "5432"
          PRIMARY_PGSUPERUSER: owl_ci
          PRIMARY_PGSUPERPASSWORD: owl_ci
          PRIMARY_PGDATABASE: owl_ci
        run: ./scripts/ci/tests/test_verify_cross_cluster_dr_temp_hygiene.sh
      - name: Run clean-restart CI
        shell: bash
        run: ./scripts/ci/run-ci.sh
