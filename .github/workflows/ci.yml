name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-restart-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owl_ci
          POSTGRES_PASSWORD: owl_ci
          POSTGRES_DB: owl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U owl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # ADR-0001 SEC-1 §3 "Roles and DSNs": owl_app is the identity every
      # sink DSN uses (never BYPASSRLS, subject to FORCE) and is what
      # anything exercising RLS -- including this var -- must connect as.
      # owl_ci (the service's bootstrap POSTGRES_USER) is a superuser and
      # unconditionally bypasses row security regardless of FORCE, so it
      # must not be the identity CI tests connect as (INFRA-4).
      OWL_TEST_DATABASE_URL: postgresql://owl_app:owl_app@localhost:5432/owl_ci
      OWL_MIGRATOR_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Provision owl_migrator and owl_app roles
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
          OWL_MIGRATOR_PASSWORD: owl_migrator
          OWL_APP_PASSWORD: owl_app
        run: ./scripts/ci/provision_test_roles.sh create-roles
      - name: Apply database migrations
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U owl_migrator -d owl_ci -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Grant owl_app privileges on tenant-scoped tables
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-app-privileges
      - name: Run clean-restart CI
        shell: bash
        run: ./scripts/ci/run-ci.sh
