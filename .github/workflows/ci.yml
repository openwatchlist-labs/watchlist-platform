name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-restart-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owl_ci
          POSTGRES_PASSWORD: owl_ci
          POSTGRES_DB: owl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U owl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      OWL_TEST_DATABASE_URL: postgresql://owl_ci:owl_ci@localhost:5432/owl_ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        if: ${{ hashFiles('go.mod') != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Apply database migrations
        shell: bash
        env:
          PGPASSWORD: owl_ci
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U owl_ci -d owl_ci -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run clean-restart CI
        shell: bash
        run: ./scripts/ci/run-ci.sh
