name: Release Qualification

on:
  pull_request:
    branches: [main]
    # See ci.yml's on.pull_request.paths-ignore comment: this job runs
    # scripts/release/qualify-prerelease.sh, whose first action is the same
    # ./scripts/ci/run-ci.sh that ci.yml runs, so the same two subtrees
    # (docs/governance/**, docs/homelab/** + scripts/deployment/r2-4/**)
    # must stay excluded from the ignore list for the same reason: CI
    # validates their content, not just build correctness.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '!docs/governance/**'
      - '!docs/homelab/**'
      - '!scripts/deployment/r2-4/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.1
jobs:
  release-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # This job's "Qualify deterministic prerelease assets" step below runs
    # scripts/release/qualify-prerelease.sh, whose first action is the
    # unmodified ./scripts/ci/run-ci.sh -- the same full clean-restart gate
    # CI/clean-restart-gates runs (.github/workflows/ci.yml). Its own design
    # doc (docs/release-engineering-r2-2-r2.md) states this workflow
    # qualifies a prerelease by "running complete native CI", and
    # qualification-summary.json's native_ci_validated field is a formal
    # claim consumed as release evidence (docs/release-engineering-r2-4.md
    # records it against the actual v0.1.0-rc.4 release). Provisioning here
    # mirrors ci.yml's postgres service and role setup exactly -- see that
    # file's comments for the per-role rationale (ADR-0001 SEC-1 §3,
    # ADR-0007 §5.3 and Addendum 1 D17/F6) -- so that claim is genuinely
    # proven rather than reached via run-ci.sh's every database-backed
    # check silently self-skipping (ADR-0007 Addendum 1 D18; local issue
    # register: REL-2-followup).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: owl_ci
          POSTGRES_PASSWORD: owl_ci
          POSTGRES_DB: owl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U owl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      OWL_TEST_DATABASE_URL: postgresql://owl_app:owl_app@localhost:5432/owl_ci
      OWL_MIGRATOR_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci
      OWL_LEDGER_ANCHOR_DATABASE_URL: postgresql://owl_ledger_anchor:owl_ledger_anchor@localhost:5432/owl_ci
      OWL_LEDGER_DDL_DATABASE_URL: postgresql://owl_ledger_ddl:owl_ledger_ddl@localhost:5432/owl_ci
      # SEC-7 Addendum 2 D21/D22 (F-E, CRITICAL) -- mirrors ci.yml's own
      # gate exactly, so this workflow's native_ci_validated claim proves
      # the same five database gates ci.yml does, not four of five.
      OWL_MIGRATOR_STALE_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_stale
      OWL_BOOTSTRAP_SUPERUSER_DATABASE_URL: postgresql://owl_ci:owl_ci@localhost:5432/owl_ci
      OWL_MIGRATOR_UNPROVISIONED_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_sec7_unprovisioned
      # SEC-2 followup (Sprint 0 register reconciliation) -- mirrors
      # ci.yml's own gate exactly, same reason as the two above: a fourth
      # disposable database with ZERO db/migrations/ applied.
      # internal/schemasqlgate's suite provisions it itself, by executing
      # screeningledger/alertcase/assistancerag's own SchemaSQL consts
      # directly over a live connection (Migrate()'s real bootstrap path,
      # with no dependency on db/migrations/ ever having run), then proves
      # TRUNCATE guards hold.
      OWL_SCHEMASQL_ONLY_DATABASE_URL: postgresql://owl_migrator:owl_migrator@localhost:5432/owl_ci_schemasql_only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.97.1 x86_64-unknown-linux-gnu
      - name: Provision owl_migrator, owl_app, owl_ledger_anchor, and owl_ledger_ddl roles
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
          OWL_MIGRATOR_PASSWORD: owl_migrator
          OWL_APP_PASSWORD: owl_app
          OWL_LEDGER_ANCHOR_PASSWORD: owl_ledger_anchor
          OWL_LEDGER_DDL_PASSWORD: owl_ledger_ddl
        run: ./scripts/ci/provision_test_roles.sh create-roles
      - name: Apply database migrations
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql -h localhost -U owl_migrator -d owl_ci -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Grant owl_app privileges on tenant-scoped tables
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-app-privileges
      - name: Transfer anchor/tombstone ownership to owl_ledger_ddl and install the D26 DDL event trigger
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh grant-ddl-ownership
      - name: Create SEC-7 Addendum 2 stale-schema database (D21/D22)
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-stale-anchor-database
      - name: Apply migrations through 016 only to the stale-schema database
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            base="$(basename "$f")"
            [[ "$base" > "016_screening_ledger_anchor_sequence_comment.sql" ]] && continue
            echo "applying $f to owl_ci_sec7_stale"
            psql -h localhost -U owl_migrator -d owl_ci_sec7_stale -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Create SEC-7 Addendum 3 unprovisioned-schema database (D33/G-A)
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-unprovisioned-database
      - name: Apply every migration, but no provisioning, to the unprovisioned database
        shell: bash
        env:
          PGPASSWORD: owl_migrator
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f to owl_ci_sec7_unprovisioned"
            psql -h localhost -U owl_migrator -d owl_ci_sec7_unprovisioned -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Create SEC-2 followup SchemaSQL-only-bootstrap database
        shell: bash
        env:
          PGSUPERUSER: owl_ci
          PGSUPERPASSWORD: owl_ci
        run: ./scripts/ci/provision_test_roles.sh create-schemasql-only-database
      - name: Qualify deterministic prerelease assets
        shell: bash
        run: |
          ./scripts/release/qualify-prerelease.sh \
            --version 0.1.0-rc.4 \
            --vcs-ref "${GITHUB_SHA}" \
            --source-date-epoch "$(git show -s --format=%ct "${GITHUB_SHA}")" \
            --output "${RUNNER_TEMP}/openwatchlist-prerelease-qualification"
          cat "${RUNNER_TEMP}/openwatchlist-prerelease-qualification/qualification-summary.json"
