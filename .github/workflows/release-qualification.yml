name: Release Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  release-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Qualify deterministic prerelease assets
        shell: bash
        run: |
          ./scripts/release/qualify-prerelease.sh \
            --version 0.1.0-rc.3 \
            --vcs-ref "${GITHUB_SHA}" \
            --source-date-epoch "$(git show -s --format=%ct "${GITHUB_SHA}")" \
            --output "${RUNNER_TEMP}/openwatchlist-prerelease-qualification"
          cat "${RUNNER_TEMP}/openwatchlist-prerelease-qualification/qualification-summary.json"
